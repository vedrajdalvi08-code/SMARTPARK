<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Bookings | SMARTPARK</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/dashboard.css"></head>
<body class="modern-site"><nav class="site-nav"><a href="/parking" class="nav-brand"><span class="brand-mark">P</span><strong>SMARTPARK</strong></a><button class="mobile-menu-toggle" type="button" aria-expanded="false" aria-controls="siteNav">☰</button><ul class="site-nav-links" id="siteNav"><li><a href="/parking">Discover parking</a></li><li><a href="/booking">Find Parking</a></li><li><a href="/maps">Maps</a></li><li><a class="active" href="/customer">My Bookings</a></li><li><a href="/parking">Parking website</a></li><li><button class="theme-toggle" type="button" onclick="toggleTheme()">☼</button></li><li><a href="/profile">Profile</a></li></ul></nav>
<main class="page-shell dashboard-page"><header class="dashboard-heading"><div><span class="eyebrow">Customer dashboard</span><h1 id="welcomeTitle">My Bookings</h1><p>View and manage your parking reservations.</p></div><a href="/booking" class="btn btn-primary">Book a slot →</a></header><p id="dashboardState" class="state-message" role="status">Loading your bookings…</p><section class="booking-tabs dashboard-tabs" role="tablist"><button class="active" data-tab="upcoming">Upcoming</button><button data-tab="active">Active</button><button data-tab="completed">Completed</button><button data-tab="cancelled">Cancelled</button></section><section id="bookingList" class="dashboard-booking-list"></section></main><nav class="mobile-bottom-nav"><a href="/parking">⌂<span>Home</span></a><a href="/booking">⌕<span>Find Parking</span></a><a href="/maps">⌖<span>Maps</span></a><a class="active" href="/customer">▣<span>Bookings</span></a><a href="/profile">◯<span>Profile</span></a></nav>
<div class="qr-dialog" id="qrDialog" hidden><div class="qr-dialog-card" role="dialog" aria-modal="true" aria-labelledby="qrTitle"><button class="modal-close" id="closeQr" type="button">×</button><h2 id="qrTitle">Parking QR Ticket</h2><div id="qrContent"></div></div></div><script src="/app.js"></script><script src="/customer-tools.js"></script><script>
(()=>{let data=null,tab='upcoming';const list=document.getElementById('bookingList'),state=document.getElementById('dashboardState');const row=(label,value)=>{const d=document.createElement('div');d.className='booking-detail';const s=document.createElement('span');s.textContent=label;const b=document.createElement('strong');b.textContent=value||'—';d.append(s,b);return d;};const showQr=t=>{const c=document.getElementById('qrContent');c.replaceChildren();const img=document.createElement('img');img.className='dashboard-qr';img.alt='Secure parking QR ticket';img.src=ticketQrUrl(t.ticket_code);const ref=document.createElement('code');ref.textContent=t.ticket_code;c.append(img,ref,row('Vehicle',t.vehicle_number),row('Slot',t.slot_number),row('Status',t.status));document.getElementById('qrDialog').hidden=false;};function filtered(){return(data?.bookings||[]).filter(t=>tab==='upcoming'?t.status==='ACTIVE'&&!t.entry_time:tab==='active'?t.status==='ACTIVE'&&t.entry_time:tab==='completed'?t.status==='COMPLETED':t.status==='CANCELLED');}function render(){list.replaceChildren();const items=filtered();if(!items.length){const empty=document.createElement('div');empty.className='dashboard-empty';empty.textContent=`No ${tab} bookings yet.`;list.append(empty);return;}items.forEach(t=>{const card=document.createElement('article');card.className='dashboard-booking-card';const head=document.createElement('div');head.className='dashboard-card-head';const title=document.createElement('div');title.innerHTML='<span class="dashboard-location-icon">⌖</span>';const copy=document.createElement('div');const h=document.createElement('h2');h.textContent='SMARTPARK Parking';const p=document.createElement('p');p.textContent='Configured parking location';copy.append(h,p);title.append(copy);const badge=document.createElement('span');badge.className='open-pill';badge.textContent=t.status==='ACTIVE'?(t.entry_time?'Active':'Upcoming'):t.status;head.append(title,badge);card.append(head,row('Booking date',formatISTDateTime(t.booking_time)),row('Entry / check-in',t.entry_time?formatISTDateTime(t.entry_time):'Not checked in'),row('Vehicle',t.vehicle_number),row('Slot',t.slot_number),row('Session',t.entry_mode||'RESERVATION'),row('Amount',t.total_amount?`₹${t.total_amount}`:'Estimate after check-in'));const actions=document.createElement('div');actions.className='dashboard-card-actions';const details=document.createElement('button');details.className='btn btn-secondary';details.textContent='View details';details.onclick=()=>showQr(t);actions.append(details);if(t.status==='ACTIVE'&&!t.entry_time){const cancel=document.createElement('button');cancel.className='btn btn-danger';cancel.textContent='Cancel booking';cancel.onclick=async()=>{if(!confirm('Cancel this reservation?'))return;const r=await fetchAPI(`/customer/bookings/${encodeURIComponent(t.ticket_code)}/cancel`,{method:'POST'});if(!r.ok)state.textContent=r.data.error||'Cancellation failed.';else load();};actions.append(cancel);}card.append(actions);list.append(card);});}async function load(){const auth=await fetchAPI('/auth/me');if(!auth.ok){state.textContent='Please sign in to view your bookings.';const a=document.createElement('a');a.href='/customer/login';a.textContent=' Sign in';state.append(a);return;}const r=await fetchAPI('/customer/history');if(!r.ok){state.textContent=r.data.error||'Could not load bookings.';return;}data=r.data;state.textContent='';render();}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');tab=b.dataset.tab;render();});document.getElementById('closeQr').onclick=()=>document.getElementById('qrDialog').hidden=true;document.getElementById('qrDialog').onclick=e=>{if(e.target.id==='qrDialog')e.currentTarget.hidden=true;};load();})();
</script></body></html>
