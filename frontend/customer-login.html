<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in | SMARTPARK</title><link rel="stylesheet" href="/style.css"></head>
<body class="auth-page"><div class="auth-orb auth-orb-one"></div><div class="auth-orb auth-orb-two"></div><nav class="navbar auth-nav"><a class="nav-brand" href="/parking"><div class="brand-icon">P</div><span>SMARTPARK CUSTOMER</span></a><a class="portal-nav-link" href="/portals">Choose portal</a></nav><main class="auth-shell"><form class="auth-card auth-glass" id="customerLoginForm" autocomplete="off"><div class="auth-kicker">Customer parking</div><h1>Welcome back</h1><p class="auth-lead">Sign in to view your parking pass, sessions, and receipts.</p><div class="form-group"><label class="form-label" for="username">Username</label><input class="form-input" id="username" name="login-user" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" required></div><div class="form-group"><label class="form-label" for="password">Password</label><input class="form-input" id="password" name="login-pass" type="password" autocomplete="new-password" required></div><p class="auth-error" id="error" role="alert"></p><button class="btn btn-primary btn-block auth-submit" type="submit"><span class="button-label">Sign in</span><span class="button-spinner" aria-hidden="true"></span></button><p class="auth-switch">New customer? <a href="/customer/register">Create an account</a></p></form></main><script src="/app.js"></script><script>
const form=document.getElementById('customerLoginForm');form.addEventListener('submit',async event=>{event.preventDefault();const error=document.getElementById('error'),button=form.querySelector('.auth-submit');error.textContent='';button.disabled=true;button.classList.add('is-loading');const result=await fetchAPI('/auth/login',{method:'POST',body:JSON.stringify({username:document.getElementById('username').value.trim(),password:document.getElementById('password').value})});if(result.ok){button.querySelector('.button-label').textContent='Signed in';window.location.href='/customer';}else{error.textContent=result.data.error||'Sign in failed';button.disabled=false;button.classList.remove('is-loading');}});
</script></body></html>
