<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | SMARTPARK</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/admin.css">
</head>
<body class="admin-login-page">
  <nav class="admin-shell-nav">
    <a href="/admin/login" class="admin-brand"><span class="admin-brand-mark">SP</span><span><strong>SMARTPARK</strong><small>Operations</small></span></a>
  </nav>
  <main class="admin-login-shell">
    <form class="admin-login-card" id="adminLoginForm">
      <div class="admin-login-kicker">Restricted operations access</div>
      <h1>Administrator sign in</h1>
      <p>Sign in with an authorized operations account to open the control center.</p>
      <div class="form-group">
        <label class="form-label" for="adminUsername">Username</label>
        <input class="form-input" id="adminUsername" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="adminPassword">Password</label>
        <input class="form-input" id="adminPassword" type="password" autocomplete="current-password" required>
      </div>
      <p class="auth-error" id="adminLoginError" role="alert"></p>
      <button class="btn btn-primary btn-block" type="submit">Sign in to admin console</button>
      <a class="admin-login-back" href="/portals">Choose a different portal</a>
    </form>
  </main>
  <script src="/app.js"></script>
  <script>
    document.getElementById("adminLoginForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const error = document.getElementById("adminLoginError");
      error.textContent = "";
      const result = await fetchAPI("/admin/login", {
        method: "POST",
        body: JSON.stringify({
          username: document.getElementById("adminUsername").value,
          password: document.getElementById("adminPassword").value
        })
      });
      if (result.ok && result.data.success) {
        window.location.href = "/admin";
      } else {
        error.textContent = result.data.error || "Login failed";
      }
    });
  </script>
</body>
</html>
