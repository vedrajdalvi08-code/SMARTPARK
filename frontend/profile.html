<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile | SMARTPARK</title><link rel="stylesheet" href="/style.css"></head><body class="modern-site"><nav class="site-nav"><a href="/parking" class="nav-brand"><span class="brand-mark">P</span><strong>SMARTPARK</strong></a><button class="mobile-menu-toggle" aria-controls="siteNav" aria-expanded="false">☰</button><ul class="site-nav-links" id="siteNav"><li><a href="/parking">Home</a></li><li><a href="/booking">Find Parking</a></li><li><a href="/maps">Maps</a></li><li><a href="/bookings">My Bookings</a></li><li><a class="active" href="/profile">Profile</a></li><li><button class="theme-toggle" onclick="toggleTheme()">☼</button></li></ul></nav><main class="page-shell profile-page"><div class="page-heading"><span class="eyebrow">Account</span><h1>Profile</h1><p>Manage your customer account securely.</p></div><section class="profile-hero"><div class="avatar" id="avatar">?</div><div><h2 id="profileName">Loading…</h2><p id="profileEmail">—</p></div></section><section class="profile-settings"><form id="profileForm"><label class="form-label" for="username">Username</label><input class="form-input" id="username" autocomplete="off" maxlength="60" required><button class="btn btn-primary" type="submit">Save changes</button><p id="profileMessage" class="state-message" role="status"></p></form><button class="btn btn-danger" id="logout" type="button">Log out</button></section></main><nav class="mobile-bottom-nav"><a href="/parking">⌂<span>Home</span></a><a href="/booking">⌕<span>Find Parking</span></a><a href="/maps">⌖<span>Maps</span></a><a href="/bookings">▣<span>Bookings</span></a><a class="active" href="/profile">◯<span>Profile</span></a></nav><script src="/app.js"></script><script src="/account-tools.js"></script><script src="/customer-tools.js"></script><script>
(()=>{const msg=document.getElementById('profileMessage');async function load(){const r=await fetchAPI('/customer/profile');if(!r.ok){msg.textContent=r.data.error||'Please sign in.';return;}const u=r.data.user;document.getElementById('profileName').textContent=u.full_name;document.getElementById('profileEmail').textContent=u.email||'Customer account';document.getElementById('username').value=u.username;document.getElementById('avatar').textContent=(u.full_name||u.username||'?')[0].toUpperCase();}document.getElementById('profileForm').onsubmit=async e=>{e.preventDefault();const r=await fetchAPI('/customer/profile',{method:'PUT',body:JSON.stringify({username:document.getElementById('username').value})});msg.textContent=r.ok?'Profile updated.':(r.data.error||'Update failed.');};document.getElementById('logout').onclick=async()=>{await fetchAPI('/auth/logout',{method:'POST'});location.href='/customer/login';};load();})();
</script></body></html>
