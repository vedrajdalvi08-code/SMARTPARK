<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create Customer Account | SMARTPARK</title><link rel="stylesheet" href="/style.css"></head>
<body><nav class="navbar"><a class="nav-brand" href="/parking"><div class="brand-icon">P</div><span>SMARTPARK CUSTOMER</span></a><a class="portal-nav-link" href="/portals">Choose portal</a></nav><main class="auth-shell"><form class="auth-card" id="customerRegisterForm"><div class="auth-kicker">Customer account</div><h1>Create account</h1><div class="form-group"><label class="form-label" for="fullName">Full name</label><input class="form-input" id="fullName" required></div><div class="form-group"><label class="form-label" for="username">Username</label><input class="form-input" id="username" autocomplete="username" required></div><div class="form-group"><label class="form-label" for="email">Email</label><input class="form-input" id="email" type="email"></div><div class="form-group"><label class="form-label" for="password">Password</label><input class="form-input" id="password" type="password" minlength="12" required></div><p class="auth-error" id="error" role="alert"></p><button class="btn btn-primary btn-block">Create account</button><p>Already registered? <a href="/customer/login">Sign in</a></p></form></main><script src="/app.js"></script><script>
document.getElementById('customerRegisterForm').addEventListener('submit', async (event) => { event.preventDefault(); const error = document.getElementById('error'); const result = await fetchAPI('/auth/register', { method: 'POST', body: JSON.stringify({ full_name: document.getElementById('fullName').value, username: document.getElementById('username').value, email: document.getElementById('email').value, password: document.getElementById('password').value }) }); if (result.ok) window.location.href = '/customer'; else error.textContent = result.data.error || 'Registration failed'; });
</script></body></html>
