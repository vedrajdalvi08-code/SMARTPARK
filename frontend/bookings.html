<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Bookings | SMARTPARK</title><link rel="stylesheet" href="/style.css"></head><body class="modern-site"><nav class="site-nav"><a href="/parking" class="nav-brand"><span class="brand-mark">P</span><strong>SMARTPARK</strong></a><button class="mobile-menu-toggle" aria-controls="siteNav" aria-expanded="false">☰</button><ul class="site-nav-links" id="siteNav"><li><a href="/parking">Home</a></li><li><a href="/booking">Find Parking</a></li><li><a href="/maps">Maps</a></li><li><a class="active" href="/bookings">My Bookings</a></li><li><a href="/parking#support">Support</a></li><li><button class="theme-toggle" onclick="toggleTheme()">☼</button></li></ul></nav><main class="page-shell"><div class="page-heading"><span class="eyebrow">Your parking</span><h1>My Bookings</h1><p>View and manage your parking reservations.</p></div><div class="booking-tabs" role="tablist"><button class="active" data-tab="upcoming">Upcoming</button><button data-tab="active">Active</button><button data-tab="completed">Completed</button><button data-tab="cancelled">Cancelled</button></div><section id="bookingCards" class="booking-card-list"><p class="state-message">Loading your bookings…</p></section></main><nav class="mobile-bottom-nav"><a href="/parking">⌂<span>Home</span></a><a href="/booking">⌕<span>Find Parking</span></a><a href="/maps">⌖<span>Maps</span></a><a class="active" href="/bookings">▣<span>Bookings</span></a><a href="/profile">◯<span>Profile</span></a></nav><script src="/app.js"></script><script>
(()=>{let data=null,tab='upcoming';const cards=document.getElementById('bookingCards');const row=(label,value)=>{const d=document.createElement('div');d.className='detail-row';const s=document.createElement('span');s.textContent=label;const b=document.createElement('strong');b.textContent=value||'—';d.append(s,b);return d;};function render(){cards.replaceChildren();const all=data?.bookings||[];const filtered=all.filter(t=>tab==='upcoming'?t.status==='ACTIVE'&&!t.entry_time:tab==='active'?t.status==='ACTIVE'&&t.entry_time:tab=== 'completed'?t.status==='COMPLETED':t.status==='CANCELLED');if(!filtered.length){cards.textContent=`No ${tab} bookings.`;return;}filtered.forEach(t=>{const card=document.createElement('article');card.className='booking-card';const head=document.createElement('div');head.className='booking-card-head';const title=document.createElement('h2');title.textContent='SMARTPARK Parking';const badge=document.createElement('span');badge.className='open-pill';badge.textContent=t.status;head.append(title,badge);card.append(head,row('Reference',t.ticket_code),row('Vehicle',t.vehicle_number),row('Scheduled / entry',formatISTDateTime(t.entry_time||t.booking_time)),row('Slot',t.slot_number),row('Duration',t.duration_minutes?`${t.duration_minutes} minutes`:'Not started'),row('Amount',t.total_amount?`₹${t.total_amount}`:'Estimate available after entry'));if(t.status==='ACTIVE'&&!t.entry_time){const cancel=document.createElement('button');cancel.className='btn btn-danger';cancel.textContent='Cancel booking';cancel.onclick=async()=>{if(!confirm('Cancel this reservation?'))return;const csrf=sessionStorage.getItem('smartpark-csrf');const r=await fetchAPI(`/customer/bookings/${encodeURIComponent(t.ticket_code)}/cancel`,{method:'POST',headers:{'X-CSRF-Token':csrf}});if(!r.ok)alert(r.data.error||'Cancellation failed');else load();};card.append(cancel);}cards.append(card);});}async function load(){const r=await fetchAPI('/customer/history');if(!r.ok){cards.textContent=r.data.error||'Sign in to view bookings.';return;}data=r.data;render();}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');tab=b.dataset.tab;render();});load();})();
</script></body></html>
