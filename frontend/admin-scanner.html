<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR Scanner | SMARTPARK Operations</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/admin.css">
</head>
<body class="admin-login-page">
  <nav class="admin-shell-nav" aria-label="Operations navigation">
    <a href="/admin" class="admin-brand"><span class="admin-brand-mark">SP</span><span><strong>SMARTPARK</strong><small>Operations</small></span></a>
    <div class="admin-nav-actions"><a class="admin-logout" href="/admin">Dashboard</a><a class="admin-logout" href="/portals">Other portal</a><button class="admin-logout" type="button" id="logout">Log out</button></div>
  </nav>
  <main class="admin-scanner-layout">
    <section class="admin-login-card scanner-card">
      <div class="admin-login-kicker">Gate operations</div>
      <h1>QR ticket scanner</h1>
      <p>Scan once to authorize entry. A later scan identifies the active session and shows the payment or exit action required.</p>
      <div id="reader" class="scanner-reader" aria-label="Camera QR scanner"><video id="qrVideo" class="scanner-video" playsinline muted></video></div>
      <div class="scanner-actions"><button class="btn btn-primary" id="startScanner">Start camera</button><button class="btn btn-secondary" id="stopScanner" disabled>Stop camera</button></div>
      <label class="form-label" for="manualToken">Manual ticket code</label>
      <div class="scanner-manual"><input class="form-input" id="manualToken" placeholder="SP-..." autocomplete="off"><button class="btn btn-secondary" id="submitManual">Process</button></div>
      <p id="scannerStatus" class="scanner-status" role="status">Camera is stopped. Manual entry is available.</p>
      <article id="scanResult" class="scanner-result" hidden></article>
    </section>
  </main>
  <script src="/app.js"></script>
  <script>
    (() => {
      let scanner = null;
      let nativeStream = null;
      let nativeLoop = null;
      let nativeDetector = null;
      let busy = false;
      const status = document.getElementById('scannerStatus');
      const result = document.getElementById('scanResult');
      const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
      const render = data => { const booking = data.booking || {}; result.hidden = false; result.innerHTML = `<strong>${esc(data.message || 'Scan processed')}</strong><p>Vehicle: ${esc(booking.vehicle_number)} · Slot: ${esc(booking.slot?.slot_number || booking.ticket?.slot_number || 'Pending')}</p><p>Entry: ${esc(booking.entry_time || booking.ticket?.entry_time || 'Not entered')} · Next: ${esc(data.next_action || (data.entry_authorized ? 'ENTRY_AUTHORIZED' : booking.payment_status))}</p>`; };
      async function stopCamera() { if (nativeLoop) { cancelAnimationFrame(nativeLoop); nativeLoop = null; } if (nativeStream) { nativeStream.getTracks().forEach(track => track.stop()); nativeStream = null; } if (scanner) { await scanner.stop().catch(() => {}); scanner.clear(); } document.getElementById('qrVideo').srcObject = null; document.getElementById('startScanner').disabled = false; document.getElementById('stopScanner').disabled = true; }
      async function processToken(token) { if (busy || !token.trim()) return; busy = true; status.textContent = 'Validating ticket and processing scan…'; try { const response = await fetchAPI('/admin/qr/scan-entry', { method: 'POST', body: JSON.stringify({ token }) }); if (!response.ok) { status.textContent = response.data?.error || `Scanner request failed (${response.status || 'network error'}).`; return; } await stopCamera(); status.textContent = 'Scan accepted.'; render(response.data); } catch (error) { status.textContent = 'Scanner could not reach the backend. Confirm Flask is running and you are signed in.'; } finally { busy = false; } }
      document.getElementById('submitManual').onclick = () => processToken(document.getElementById('manualToken').value);
      async function startNativeCamera() { const video = document.getElementById('qrVideo'); nativeDetector = new BarcodeDetector({ formats: ['qr_code'] }); nativeStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false }); video.srcObject = nativeStream; await video.play(); const detect = async () => { if (!nativeStream || busy) { if (nativeStream) nativeLoop = requestAnimationFrame(detect); return; } try { const codes = await nativeDetector.detect(video); if (codes[0]?.rawValue) { await processToken(codes[0].rawValue); return; } } catch (_) {} nativeLoop = requestAnimationFrame(detect); }; nativeLoop = requestAnimationFrame(detect); }
      async function loadQrFallback() { if (window.Html5Qrcode) return; await new Promise((resolve, reject) => { const script = document.createElement('script'); script.src = 'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js'; script.onload = resolve; script.onerror = () => reject(new Error('QR decoder could not be loaded.')); document.head.append(script); }); }
      async function startLibraryCamera() { await loadQrFallback(); if (!window.Html5Qrcode) throw new Error('decoder unavailable'); scanner = scanner || new Html5Qrcode('reader'); await scanner.start({ facingMode: 'environment' }, { fps: 15, qrbox: { width: 280, height: 280 } }, token => processToken(token), () => {}); }
      document.getElementById('startScanner').onclick = async () => { document.getElementById('startScanner').disabled = true; document.getElementById('stopScanner').disabled = false; status.textContent = 'Requesting camera permission…'; try { if ('BarcodeDetector' in window && navigator.mediaDevices?.getUserMedia) await startNativeCamera(); else await startLibraryCamera(); status.textContent = 'Scanning for a SMARTPARK ticket…'; } catch (error) { await stopCamera(); status.textContent = 'Camera could not start. Check permission or use manual entry.'; } };
      document.getElementById('stopScanner').onclick = async () => { await stopCamera(); status.textContent = 'Camera stopped. Manual entry is available.'; };
      document.getElementById('logout').onclick = async () => { await fetchAPI('/admin/logout', { method: 'POST' }); window.location.href = '/admin/login'; };
      window.addEventListener('pagehide', () => { stopCamera(); });
    })();
  </script>
</body>
</html>
